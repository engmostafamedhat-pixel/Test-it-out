<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mission Reports Dashboard</title>
  <style>
    :root{--bg:#f2f5f7;--card:#fff;--ink:#14202b;--muted:#5b6b78;--line:#d6dde3;--accent:#0b6e4f;--warn:#b35c00;--err:#b3261e}
    @media (prefers-color-scheme:dark){:root{--bg:#0f1418;--card:#182027;--ink:#e6edf2;--muted:#9aa9b5;--line:#2b3640;--accent:#3fb68b;--warn:#f0a24a;--err:#ff8a80}}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    header{background:var(--accent);color:#fff;padding:14px 16px;font-weight:700;font-size:18px}
    main{max-width:1200px;margin:0 auto;padding:16px}
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
    .filters input,.filters select,.filters button,.filters a{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:38px}
    .filters input[type=search]{flex:1;min-width:200px}
    .filters button,.filters a{cursor:pointer;text-decoration:none;font-weight:600}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
    .kpi b{display:block;font-size:24px} .kpi span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
    .wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
    table{width:100%;border-collapse:collapse;min-width:820px}
    th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
    tr:hover td{background:rgba(11,110,79,.05)}
    .st{font-weight:700} .st.Blocked{color:var(--err)} .st.On.Hold,.st.Partially{color:var(--warn)}
    .issue{color:var(--err);font-size:12px;max-width:280px}
    .empty{padding:40px;text-align:center;color:var(--muted)}
    .auth{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:420px}
    .auth input{width:100%;font:inherit;padding:8px 10px;margin:8px 0;border:1px solid var(--line);border-radius:8px}
  </style>
</head>
<body>
<header>Site Mission Reports — Project Office</header>
<main>
  <div id="auth" class="auth" hidden>
    <strong>Access token required</strong>
    <input type="password" id="tok" placeholder="Paste access token">
    <button id="tok-save">Continue</button>
  </div>
  <div id="app" hidden>
    <div class="filters">
      <input type="search" id="q" placeholder="Search site, project, technician, findings…">
      <select id="status"><option value="">All outcomes</option></select>
      <select id="mt"><option value="">All mission types</option></select>
      <input type="date" id="from" aria-label="From"><input type="date" id="to" aria-label="To">
      <button id="go">Apply</button>
      <a id="csv" href="#">Export CSV</a>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="wrap"><table>
      <thead><tr><th>Date</th><th>Site / asset</th><th>Project</th><th>Mission</th><th>Outcome</th><th>Technician</th><th>Photos</th><th>Issues</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</main>
<script>
  const esc = (v) => v == null ? '' : String(v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  const $ = (id) => document.getElementById(id);
  let token = '';
  try { token = sessionStorage.getItem('mr.adminToken') || ''; } catch {}

  async function api(path) {
    const res = await fetch(path, { headers: token ? { Authorization: 'Bearer ' + token } : {} });
    if (res.status === 401) { showAuth(); throw new Error('unauthorized'); }
    return res.json();
  }
  function showAuth() { $('auth').hidden = false; $('app').hidden = true; }

  function params() {
    const p = new URLSearchParams();
    if ($('q').value) p.set('q', $('q').value);
    if ($('status').value) p.set('status', $('status').value);
    if ($('mt').value) p.set('mission_type', $('mt').value);
    if ($('from').value) p.set('from', $('from').value);
    if ($('to').value) p.set('to', $('to').value + 'T23:59:59Z');
    return p;
  }

  async function load() {
    const rows = await api('/api/reports?' + params());
    const tq = token ? 'token=' + encodeURIComponent(token) : '';
    $('csv').href = '/api/reports.csv?' + params() + (tq ? '&' + tq : '');
    const count = (s) => rows.filter((r) => r.status === s).length;
    $('kpis').innerHTML = [
      ['Reports', rows.length],
      ['Photos', rows.reduce((a, r) => a + r.photo_count, 0)],
      ['Sites', new Set(rows.map((r) => r.site)).size],
      ['With issues', rows.filter((r) => r.issues).length],
      ['Blocked / on hold', count('Blocked') + count('On Hold')],
    ].map(([k, v]) => `<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join('');
    $('rows').innerHTML = rows.length ? rows.map((r) => `
      <tr>
        <td>${esc((r.start_time || r.created_at || '').slice(0, 10))}</td>
        <td><a href="/reports/${r.id}${tq ? '?' + tq : ''}" target="_blank">${esc(r.site)}</a>${r.asset ? '<br><small>' + esc(r.asset) + '</small>' : ''}</td>
        <td>${esc(r.project)}</td>
        <td>${esc(r.mission_type)}</td>
        <td class="st ${esc(r.status)}">${esc(r.status)}</td>
        <td>${esc(r.technician_name)}</td>
        <td>${r.photo_count}</td>
        <td class="issue">${esc((r.issues || '').slice(0, 140))}</td>
      </tr>`).join('') : '<tr><td colspan="8" class="empty">No reports match.</td></tr>';
  }

  async function init() {
    const meta = await (await fetch('/api/meta')).json();
    $('status').innerHTML += meta.statuses.map((s) => `<option>${esc(s)}</option>`).join('');
    $('mt').innerHTML += meta.missionTypes.map((s) => `<option>${esc(s)}</option>`).join('');
    const health = await (await fetch('/api/health')).json();
    if (health.authRequired && !token) return showAuth();
    $('app').hidden = false;
    load().catch(() => {});
  }

  $('tok-save').onclick = () => {
    token = $('tok').value.trim();
    try { sessionStorage.setItem('mr.adminToken', token); } catch {}
    $('auth').hidden = true; $('app').hidden = false; load().catch(() => {});
  };
  $('go').onclick = () => load().catch(() => {});
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') load().catch(() => {}); });
  init();
</script>
</body>
</html>
